<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <title>ShiftLogic</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=6">
</head>
<body>
<div class="shell" id="shell">

  <aside class="rail" id="rail" aria-label="Puzzles">
    <div class="brand">
      <svg class="mark" viewBox="0 0 24 24" aria-hidden="true"><rect x="2" y="3" width="20" height="4" rx="2"/><rect x="2" y="10" width="13" height="4" rx="2" opacity=".65"/><rect x="2" y="17" width="8" height="4" rx="2" opacity=".35"/></svg>
      <div>
        <div class="brand-name">ShiftLogic</div>
        <div class="brand-sub">Shift-notes constraint solver</div>
      </div>
    </div>

    <div class="rail-tools">
      <input id="search" type="search" placeholder="Search id, name or phrase" aria-label="Search puzzles" autocomplete="off">
      <div class="seg seg-wrap" id="filters" role="group" aria-label="Filter by kind"></div>
    </div>

    <nav class="item-list" id="item-list" aria-label="Puzzle list"></nav>
    <div class="rail-foot">
      <span class="kbd">↑</span><span class="kbd">↓</span> to move between puzzles
    </div>
  </aside>

  <main class="stage">
    <header class="bar">
      <button class="icon-btn menu-btn" id="menu-btn" aria-label="Show puzzle list">
        <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
      </button>

      <div class="title">
        <div class="title-row">
          <h1 id="item-id">—</h1>
          <span class="badge" id="item-kind"></span>
        </div>
        <div class="meta" id="item-meta"></div>
      </div>

      <div class="bar-actions">
        <div class="seg" id="budget" role="group" aria-label="Call budget"></div>
        <button class="btn primary" id="run-btn">
          <span class="spin" aria-hidden="true"></span>
          <span id="run-label">Run on Granite</span>
        </button>
        <button class="btn ghost" id="custom-btn" title="Paste your own shift notes">Custom notes</button>
        <button class="icon-btn" id="theme-btn" aria-label="Toggle theme">
          <svg viewBox="0 0 24 24"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>
        </button>
      </div>
    </header>

    <div class="tabs" role="tablist" aria-label="Views">
      <button role="tab" id="tab-item" data-tab="item" aria-selected="true">Puzzle</button>
      <button role="tab" id="tab-live" data-tab="live" aria-selected="false">Live run</button>
      <button role="tab" id="tab-score" data-tab="score" aria-selected="false">Scorecard</button>
      <span class="api-state" id="api-state"></span>
    </div>

    <div class="panel" id="panel-item" role="tabpanel" aria-labelledby="tab-item"></div>
    <div class="panel" id="panel-live" role="tabpanel" aria-labelledby="tab-live" hidden></div>
    <div class="panel" id="panel-score" role="tabpanel" aria-labelledby="tab-score" hidden></div>
  </main>
</div>

<dialog id="custom-dialog">
  <form method="dialog" class="dlg">
    <h3>Run on custom notes</h3>
    <p class="sub">Paste a full set of shift notes, header line included. The current puzzle id is sent with the request so the call is attributed to it.</p>
    <textarea id="custom-text" rows="14" spellcheck="false"></textarea>
    <div class="dlg-actions">
      <button class="btn ghost" value="cancel">Cancel</button>
      <button class="btn primary" id="custom-go" value="go">Run</button>
    </div>
  </form>
</dialog>

<div class="toasts" id="toasts" aria-live="polite"></div>
<script src="app.js?v=6"></script>
</body>
</html>
